name: Caeser

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: caeser-org/caeser/.github/workflows/ci-diagnose.yml@main
    with:
      run_id: ${{ github.event.workflow_run.id }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      base_sha: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
      command: go test -run TestLateRouteRegistrationSkippedNodes .
      caeser_repository: caeser-org/caeser
      caeser_version: v0.2.0
      comment_app_client_id: ${{ vars.CAESER_APP_CLIENT_ID }}
    secrets:
      CAESER_APP_PRIVATE_KEY: ${{ secrets.CAESER_APP_PRIVATE_KEY }}
